<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Video Converter - FFmpeg WASM Fix</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121212;
            color: #e0e0e0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
        }
        h2 { text-align: center; color: #00adb5; margin-bottom: 25px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #aaaaaa; }
        input[type="file"], select {
            width: 100%;
            padding: 10px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #00adb5;
            border: none;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        button:hover { background: #007a80; }
        button:disabled { background: #555; cursor: not-allowed; }
        #status {
            margin-top: 15px;
            padding: 10px;
            background: #252525;
            border-left: 4px solid #00adb5;
            font-size: 14px;
            white-space: pre-line;
        }
        #downloadArea { margin-top: 20px; text-align: center; display: none; }
        .download-btn {
            background: #28a745;
            text-decoration: none;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            display: inline-block;
            font-weight: bold;
        }
        .download-btn:hover { background: #218838; }
    </style>
    
    <!-- MENGGUNAKAN CDN JSDELIVR YANG JAUH LEBIH COMPATIBLE DI WINDOWS 7 -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

<div class="container">
    <h2>Video Converter WASM (Fixed)</h2>
    
    <div class="form-group">
        <label for="videoInput">Pilih File Video (Format Apapun):</label>
        <input type="file" id="videoInput" accept="video/*">
    </div>

    <div class="form-group">
        <label for="formatSelect">Format Target:</label>
        <select id="formatSelect">
            <option value="mp4">MP4</option>
            <option value="mkv">MKV</option>
            <option value="avi">AVI</option>
            <option value="mov">MOV</option>
            <option value="wmv">WMV</option>
            <option value="mpeg">MPEG</option>
            <option value="flv">FLV</option>
            <option value="mpg">MPG</option>
            <option value="vob">VOB</option>
        </select>
    </div>

    <div class="form-group">
        <label for="resSelect">Resolusi:</label>
        <select id="resSelect">
            <option value="original">Asli (Tidak Berubah)</option>
            <option value="1920x1080">1080p (Full HD)</option>
            <option value="1280x720">720p (HD)</option>
            <option value="854x480">480p (SD)</option>
            <option value="640x360">360p</option>
        </select>
    </div>

    <div class="form-group">
        <label for="compressSelect">Tingkat Kompresi:</label>
        <select id="compressSelect">
            <option value="23">Normal (Kualitas Bagus)</option>
            <option value="28">Medium (Kompresi 30%)</option>
            <option value="33">Tinggi (Kompresi 50%)</option>
            <option value="38">Ekstrem (Kompresi 70%)</option>
        </select>
    </div>

    <button id="startBtn" disabled>Memuat FFmpeg...</button>

    <div id="status">Sistem siap. Menunggu mesin FFmpeg dimuat...</div>

    <div id="downloadArea">
        <p style="color: #28a745;">✓ Konversi Selesai!</p>
        <a id="downloadLink" class="download-btn" href="#">Unduh Hasil Video</a>
    </div>
</div>

<script>
    const startBtn = document.getElementById('startBtn');
    const statusDiv = document.getElementById('status');
    const videoInput = document.getElementById('videoInput');
    const downloadArea = document.getElementById('downloadArea');
    const downloadLink = document.getElementById('downloadLink');

    let ffmpeg = null;

    async function initFFmpeg() {
        try {
            // Proteksi pengecekan library biar gak nemu "ReferenceError" lagi
            if (typeof FFmpeg === 'undefined') {
                throw new Error("Library FFmpeg gagal diunduh dari internet. Coba cek koneksi atau buka via HTTP server lokal.");
            }

            statusDiv.innerText = "Menginisialisasi mesin WebAssembly...";
            
            // Cara inisialisasi yang lebih aman untuk objek FFmpeg global
            const { createFFmpeg } = FFmpeg;
            ffmpeg = createFFmpeg({ log: true });

            await ffmpeg.load();
            
            statusDiv.innerText = "FFmpeg WASM Berhasil Dimuat! Silakan masukkan video.";
            startBtn.innerText = "Mulai Konversi Video";
            startBtn.disabled = false;
        } catch (err) {
            statusDiv.innerText = `Gagal: ${err.message}\n\nTips: Pastikan kamu menjalankan file HTML ini lewat VS Code Live Server / Localhost, bukan langsung klik 2x dari Windows Explorer!`;
            console.error(err);
        }
    }

    // Jalankan pemuatan
    initFFmpeg();

    startBtn.addEventListener('click', async () => {
        const files = videoInput.files;
        if (files.length === 0) {
            alert("Bro, pilih filenya dulu!");
            return;
        }

        const file = files[0];
        startBtn.disabled = true;
        downloadArea.style.display = "none";
        statusDiv.innerText = "Membaca file video ke Virtual File System...";

        const inputName = file.name;
        const outputExt = document.getElementById('formatSelect').value;
        const outputName = `output.${outputExt}`;

        // Menggunakan FFmpeg.fetchFile jika tersedia, atau buat cadangan manual
        const { fetchFile } = FFmpeg;
        ffmpeg.FS('writeFile', inputName, await fetchFile(file));

        const resChoice = document.getElementById('resSelect').value;
        const crfValue = document.getElementById('compressSelect').value;

        let ffmpegArgs = ['-i', inputName];

        if (resChoice !== 'original') {
            const [width, height] = resChoice.split('x');
            ffmpegArgs.push('-vf', `scale=${width}:${height}`);
        }

        ffmpegArgs.push('-c:v', 'libx264', '-crf', crfValue, '-preset', 'ultrafast', outputName);
        statusDiv.innerText = `Sedang memproses konversi ke format ${outputExt.toUpperCase()}...`;

        ffmpeg.setLogger(({ message }) => {
            if(message.includes('frame=')) {
                statusDiv.innerText = `Status Pemrosesan:\n${message}`;
            }
        });

        try {
            await ffmpeg.run(...ffmpegArgs);

            const data = ffmpeg.FS('readFile', outputName);
            const videoBlob = new Blob([data.buffer], { type: `video/${outputExt}` });
            const url = URL.createObjectURL(videoBlob);

            downloadLink.href = url;
            downloadLink.download = `converted_video.${outputExt}`;
            downloadArea.style.display = "block";
            statusDiv.innerText = "Proses selesai 100%!";

            ffmpeg.FS('unlink', inputName);
            ffmpeg.FS('unlink', outputName);

        } catch (error) {
            statusDiv.innerText = `Terjadi kesalahan saat konversi: ${error.message}`;
        } finally {
            startBtn.disabled = false;
        }
    });
</script>

</body>
</html>
